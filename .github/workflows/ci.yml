name: CI

on:
  push:
    branches: ["**"]
    # Senza questa riga il workflow non scatta mai su un tag, e il job che
    # pubblica su GHCR — condizionato proprio ai tag — non puo' girare per
    # definizione. Un meccanismo di rilascio che non parte mai e' peggio di
    # nessun meccanismo: sembra esserci.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Sintassi bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n fiuto.sh
      - name: Verifica bit di esecuzione
        run: test -x fiuto.sh || { echo "fiuto.sh non è eseguibile"; exit 1; }

  build:
    # fiuto.sh e' generato da src/ tramite build.sh e viene committato perche'
    # il tool si distribuisce come file singolo. Le due forme possono divergere
    # se qualcuno modifica il file generato invece dei sorgenti: questo job lo
    # impedisce.
    name: Build allineato ai sorgenti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ./build.sh --check
        run: ./build.sh --check
      # Le build sono due e si rigenerano separatamente: chi modifica un
      # sorgente e lancia solo ./build.sh lascia indietro fiuto-macos.sh, e
      # sul Mac finisce una versione vecchia senza che nulla lo segnali.
      - name: ./buildMac.sh --check
        run: ./buildMac.sh --check
      - name: Sintassi di entrambe le build
        run: bash -n fiuto.sh && bash -n fiuto-macos.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version
      - name: Lint (severità >= warning)
        run: shellcheck -S warning -x fiuto.sh fiuto-macos.sh build.sh buildMac.sh

  tests:
    name: Bats
    runs-on: ubuntu-latest
    # I test dei motori di detection si auto-saltano quando la libreria manca,
    # cosi' la suite resta eseguibile su una workstation senza dipendenze. In CI
    # quel comportamento farebbe sparire la copertura senza che nulla lo
    # segnali: FIUTO_TEST_REQUIRE_DEPS trasforma ogni skip in un errore.
    env:
      FIUTO_TEST_REQUIRE_DEPS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Installa bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats
          bats --version
      - name: Installa le dipendenze dei motori di detection
        run: python3 -m pip install --quiet yara-python pyyaml
      - name: Installa gli strumenti per le immagini forensi
        # Senza sleuthkit ed ewf-tools sei test sul montaggio non girano.
        # FIUTO_TEST_REQUIRE_DEPS li fa fallire invece di saltarli in silenzio,
        # quindi vanno installati davvero.
        run: sudo apt-get install -y --no-install-recommends sleuthkit ewf-tools fdisk
      - name: Esegui la suite
        run: bats --tap tests/

  python-parsers:
    # I ~70 parser Python sono incorporati come heredoc: bash -n li tratta come
    # testo opaco, quindi un errore di sintassi resta invisibile fino a quando
    # quel modulo gira su un disco reale.
    #
    # La matrice copre la versione minima dichiarata nel README (3.9) e una
    # recente: PEP 701 (Python 3.12) ha rilassato le regole di quoting delle
    # f-string, quindi codice che compila su 3.12+ può rompersi su 3.9.
    name: Parser Python incorporati (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compila ogni heredoc Python
        run: python3 tests/lint_embedded_python.py fiuto.sh fiuto-macos.sh

  docker:
    # L'attrito maggiore per chi usa FIUTO sono le dipendenze: l'immagine le
    # azzera, ma solo se resta costruibile. Il job la costruisce a ogni push e
    # verifica che i parser ci siano davvero — un'immagine che si costruisce
    # ma in cui manca libesedb degraderebbe in silenzio proprio dove FIUTO
    # promette il contrario.
    name: Immagine Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fiuto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Le dipendenze dichiarate sono tutte presenti
        run: |
          docker run --rm fiuto:ci --deps | tee /tmp/deps.txt
          if grep -q MANCANTE /tmp/deps.txt; then
            echo "::error::l'immagine non contiene tutte le dipendenze dichiarate"
            exit 1
          fi
      - name: Il tool parte e mostra l'aiuto
        run: docker run --rm fiuto:ci --help | grep -q "fiuto.sh"
      - name: L'entrypoint avvisa se l'evidenza e' scrivibile
        run: |
          mkdir -p /tmp/ev && : > /tmp/ev/x
          docker run --rm -v /tmp/ev:/evidence fiuto:ci --help 2>&1 \
            | grep -qi "SCRITTURA" || { echo "::error::avviso mancante"; exit 1; }

      # Pubblicazione solo dai tag: un'immagine "latest" che cambia a ogni push
      # su un branch renderebbe irriproducibile un'analisi fatta la settimana
      # prima, che e' esattamente cio' che in perizia non deve succedere.
      - name: Login su GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push su GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
